name: Benchmarks

on:
  pull_request_target:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'test/**'
      - 'docs/**'
permissions:
  pull-requests: write    # action needs to post a comment

jobs:
  benchmark:
    uses: JuliaSpacePhysics/actions/.github/workflows/benchmark.yml@main
    permissions:
      actions: write
      contents: read
      pull-requests: write
